<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>émergence — ignite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#f5f3ea; --ink:#1a1410; --accent:#d97647; }

  html{ height:100%; overflow-y:auto; }
  body{
    margin:0; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:32px 24px; box-sizing:border-box; position:relative;
    font-family:"Space Mono", monospace; background:#e8d8c9;
  }

  /* ── JP Pulp background layers ── */
  .fz-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M 20 0 L 0 0 0 20' fill='none' stroke='%231a1410' stroke-width='0.5' opacity='0.15'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><path d='M 100 0 L 0 0 0 100' fill='none' stroke='%231a1410' stroke-width='0.9' opacity='0.20'/></svg>");
  }
  .fz-patches{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(ellipse 30% 22% at  6% 88%, #e8d8c9 25%, rgba(232,216,201,0) 100%),
      radial-gradient(ellipse 24% 18% at 92%  9%, #e8d8c9 20%, rgba(232,216,201,0) 100%),
      radial-gradient(ellipse 18% 24% at 80% 60%, #e8d8c9 18%, rgba(232,216,201,0) 100%),
      radial-gradient(ellipse 14% 10% at 42% 24%, #e8d8c9 30%, rgba(232,216,201,0) 100%),
      radial-gradient(ellipse 16% 12% at 55% 82%, #e8d8c9 22%, rgba(232,216,201,0) 100%),
      radial-gradient(ellipse 10% 14% at 22% 55%, #e8d8c9 15%, rgba(232,216,201,0) 100%),
      linear-gradient(to right, rgba(26,20,16,0.08) 0%, rgba(26,20,16,0.02) 6%, rgba(26,20,16,0) 14%),
      radial-gradient(ellipse 55% 45% at 98% 4%,  rgba(26,20,16,0.07) 0%, rgba(26,20,16,0) 100%),
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(232,216,201,0) 40%, rgba(205,192,180,0.18) 100%);
  }
  .fz-speedlines{ position:fixed; top:0; right:0; width:220px; height:220px; z-index:2; opacity:.1; pointer-events:none; }
  .fz-hatch{      position:fixed; bottom:0; left:0; width:180px; height:180px; z-index:2; opacity:.07; pointer-events:none; }
  .fz-border{     position:fixed; inset:10px; z-index:8; pointer-events:none; border:2px solid var(--ink); }

  /* ── home logo ── */
  #home-logo{ position:fixed; top:20px; left:20px; z-index:100; }
  #home-logo img{ height:36px; width:auto; display:block; opacity:.9; transition:opacity .2s; }
  #home-logo img:hover{ opacity:1; }

  /* ── game panel ── */
  #panel{
    position:relative; z-index:5;
    width:min(900px, 92vw);
    border:2px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
  }
  #poster{
    position:relative; width:100%; aspect-ratio:3/2;
    background:var(--paper); overflow:hidden;
  }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #grain{
    position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.06;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #controls{
    width:100%; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center;
    padding:12px 16px; box-sizing:border-box;
    background:var(--paper); border-top:2px solid var(--ink);
    font:700 10px/1.2 "Space Mono", monospace;
    color:var(--ink); letter-spacing:.07em; text-transform:uppercase;
  }
  #controls label{ display:flex; align-items:center; gap:7px; }
  #controls input[type=range]{ accent-color:var(--accent); width:88px; cursor:pointer; }
  #controls input[type=number]{ width:52px; font:inherit; letter-spacing:0; background:var(--paper); border:2px solid var(--ink); padding:4px 6px; color:var(--ink); }
  #controls select{ font:inherit; background:var(--paper); border:2px solid var(--ink); padding:5px 8px; color:var(--ink); cursor:pointer; }
  #controls button{ font:inherit; color:var(--ink); background:transparent; border:2px solid var(--ink); padding:6px 14px; cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
  #controls button:hover{ background:var(--accent); color:var(--paper); border-color:var(--accent); }
  #controls .sep-line{ width:0; height:20px; border-left:1.5px solid rgba(26,20,16,.25); }
  #color-section{ margin-left:auto; display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; }
  .col-swatch{ display:inline-block; width:22px; height:16px; border:2px solid var(--ink); cursor:pointer; vertical-align:middle; transition:transform .12s; }
  .col-swatch:hover{ transform:scale(1.2); }
  /* hidden inputs anchored at right edge so picker popup opens from there */
  .col-hidden{ position:fixed; right:16px; top:50%; width:28px; height:22px; opacity:.01; z-index:-1; border:none; padding:0; }
  .val{ min-width:28px; display:inline-block; }
  .sep{ width:100%; height:0; }

  /* ════════════════════════════════════════════
     SONIFICATION PANEL
  ════════════════════════════════════════════ */
  #sono-panel{
    position:relative; z-index:5;
    width:min(900px, 92vw);
    border:2px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    background:var(--paper);
  }
  #sono-panel.sono-off #sono-body{ opacity:.3; pointer-events:none; }

  /* header */
  #sono-header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:2px solid var(--ink);
    font:700 10px/1.2 "Space Mono", monospace; text-transform:uppercase; letter-spacing:.1em; color:var(--ink);
  }
  #sono-title{ font-family:"Anton",sans-serif; font-size:13px; letter-spacing:.18em; }
  #sono-toggle{
    font:700 10px/1 "Space Mono",monospace; text-transform:uppercase; letter-spacing:.12em;
    color:var(--ink); background:transparent; border:2px solid var(--ink);
    padding:5px 14px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  #sono-toggle.on{ background:var(--accent); color:var(--paper); border-color:var(--accent); }
  #sono-header label{ display:flex; align-items:center; gap:6px; }
  #sono-header input[type=range]{ accent-color:var(--accent); width:72px; cursor:pointer; }
  .sono-btn{ font:700 10px/1 "Space Mono",monospace; text-transform:uppercase; letter-spacing:.12em;
    color:var(--ink); background:transparent; border:2px solid var(--ink);
    padding:5px 14px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s; }
  .sono-btn:hover{ background:var(--ink); color:var(--paper); }
  .sono-btn:disabled{ opacity:.3; cursor:default; }
  #rec-btn{ margin-left:auto; }
  #rec-btn:disabled{ opacity:.3; cursor:default; }
  #rec-btn.recording{ border-color:#b03a2e; color:#b03a2e; animation:rec-pulse 1.1s ease-in-out infinite; }
  @keyframes rec-pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  /* columns */
  #sono-body{ display:grid; grid-template-columns:1fr 1fr 1fr; position:relative; }
  .sp-col{ padding:14px 16px; border-right:1px solid rgba(26,20,16,.12); }
  .sp-col:last-child{ border-right:none; }
  .sp-col-head{
    font:700 9px/1 "Space Mono",monospace; text-transform:uppercase;
    letter-spacing:.2em; color:var(--accent);
    padding-bottom:8px; margin-bottom:10px;
    border-bottom:1px solid rgba(26,20,16,.12);
  }

  /* port rows */
  .sp-row{ display:flex; align-items:center; height:32px; position:relative; }
  .sp-row.data-row{ justify-content:space-between; }
  .sp-row.param-row{ justify-content:space-between; }
  .sp-row.inst-row{ gap:10px; }
  .sp-lbl{
    font:400 9px/1 "Space Mono",monospace; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink); user-select:none;
  }
  .sp-lbl.lit{ font-weight:700; }

  /* port dots */
  .sp-dot{
    width:11px; height:11px; border-radius:50%;
    border:2px solid var(--ink); background:var(--paper);
    flex-shrink:0; cursor:crosshair;
    transition:background .12s, border-color .12s, transform .12s;
  }
  .sp-dot:hover{ transform:scale(1.35); }
  .sp-dot.lit{ background:var(--accent); border-color:var(--accent); }
  .sp-dot[data-in].lit{ cursor:pointer; }
  .sp-dot[data-in].lit:hover{ background:#b03a2e; border-color:#b03a2e; }

  /* SVG cable overlay */
  #sono-svg{
    position:absolute; inset:0; pointer-events:none; overflow:visible; z-index:10;
  }

  /* cable badge (SVG text rendered inline, clickable) */
  .cbadge-hit{ pointer-events:all; cursor:pointer; }
</style>
</head>
<body>

  <!-- JP Pulp background -->
  <div class="fz-grid"></div>
  <div class="fz-patches"></div>
  <svg class="fz-speedlines" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <line x1="220" y1="0"   x2="0"   y2="220" stroke="#1a1410" stroke-width="1.2"/>

    <line x1="178" y1="0"   x2="0"   y2="150" stroke="#1a1410" stroke-width="1"/>
    <line x1="150" y1="0"   x2="0"   y2="110" stroke="#1a1410" stroke-width=".7"/>
    <line x1="118" y1="0"   x2="0"   y2="74"  stroke="#1a1410" stroke-width="1.1"/>
    <line x1="220" y1="38"  x2="55"  y2="220" stroke="#1a1410" stroke-width=".9"/>
    <line x1="220" y1="82"  x2="100" y2="220" stroke="#1a1410" stroke-width=".7"/>

  <svg class="fz-hatch" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <pattern id="fzhatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#1a1410" stroke-width="1.2"/>
      </pattern>
    </defs>
    <rect width="180" height="180" fill="url(#fzhatch)"/>
  </svg>
  <div class="fz-border"></div>

  <a id="home-logo" href="../index.html">
    <img src="../assets/logo/logo_black.jpeg" alt="émergence — home">
  </a>

  <!-- ── game panel ── -->
  <div id="panel">
    <div id="poster">
      <canvas id="gol"></canvas>

      <label>mutation <input id="noise" type="range" min="0" max="30" value="0"><span class="val" id="noiseV">0%</span></label>
      <div class="sep"></div>
      <label>rule
        <select id="rule">
          <option value="Conway">Conway · B3/S23</option>
          <option value="HighLife">HighLife · B36/S23</option>
          <option value="DayNight">Day &amp; Night · B3678/S34678</option>
          <option value="Maze">Maze · B3/S12345</option>
          <option value="Seeds">Seeds · B2/S–</option>
          <option value="Replicator">Replicator · B1357/S1357</option>
        </select>

      <label>speed <input id="speed" type="range" min="20" max="400" value="140"><span class="val" id="speedV">140</span></label>
      <label>structure&nbsp;≥ <input id="thr" type="range" min="2" max="40" value="5"><span class="val" id="thrV">10</span></label>

        <label>background <span class="col-swatch" id="swatch-bg"     style="background:#f5f3ea"></span></label>

        <label>accent      <span class="col-swatch" id="swatch-accent" style="background:#d97647"></span></label>

        <button id="col-dark">dark</button>
      </div>
    </div>
  </div>

  <!-- ── sonification panel ── -->
  <div id="sono-panel" class="sono-off">
    <div id="sono-header">
      <span id="sono-title">Sonification</span>
      <button id="sono-toggle">off</button>
      <div class="sep-line"></div>
      <label>smooth <input id="sono-avg" type="range" min="1" max="30" value="10"><span class="val" id="sono-avgV">10</span> gen</label>
      <label>volume <input id="sono-vol" type="range" min="-36" max="0" value="-12"><span class="val" id="sono-volV">−12</span> dB</label>

      <button id="btn-random"  class="sono-btn" disabled>random</button>
      <button id="rec-btn" disabled>● rec</button>

      <!-- col 1: data sources -->

        <div class="sp-col-head">Data source</div>
        <div class="sp-row data-row"><span class="sp-lbl" id="lbl-population">population</span>   <div class="sp-dot" id="dot-population-out"   data-out="population"></div></div>
        <div class="sp-row data-row"><span class="sp-lbl" id="lbl-birthRate">birth rate</span>    <div class="sp-dot" id="dot-birthRate-out"    data-out="birthRate"></div></div>
        <div class="sp-row data-row"><span class="sp-lbl" id="lbl-deathRate">death rate</span>    <div class="sp-dot" id="dot-deathRate-out"    data-out="deathRate"></div></div>

        <div class="sp-row data-row"><span class="sp-lbl" id="lbl-clusterCount">cluster count</span><div class="sp-dot" id="dot-clusterCount-out" data-out="clusterCount"></div></div>
        <div class="sp-row data-row"><span class="sp-lbl" id="lbl-centroidX">spatial drift</span> <div class="sp-dot" id="dot-centroidX-out"   data-out="centroidX"></div></div>
        <div class="sp-row data-row"><span class="sp-lbl" id="lbl-colorRatio">color ratio</span>  <div class="sp-dot" id="dot-colorRatio-out"  data-out="colorRatio"></div></div>
      </div>

      <!-- col 2: musical parameters -->
      <div class="sp-col">
        <div class="sp-col-head">Musical parameter</div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-filterCutoff-in" data-in="filterCutoff"></div><span class="sp-lbl" id="lbl-filterCutoff-p">filter cutoff</span><div class="sp-dot" id="dot-filterCutoff-out" data-out="filterCutoff-p"></div></div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-volume-in"       data-in="volume"></div>      <span class="sp-lbl" id="lbl-volume-p">volume</span>       <div class="sp-dot" id="dot-volume-out"       data-out="volume-p"></div></div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-pitch-in"        data-in="pitch"></div>       <span class="sp-lbl" id="lbl-pitch-p">pitch</span>        <div class="sp-dot" id="dot-pitch-out"        data-out="pitch-p"></div></div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-reverbWet-in"    data-in="reverbWet"></div>   <span class="sp-lbl" id="lbl-reverbWet-p">reverb</span>    <div class="sp-dot" id="dot-reverbWet-out"    data-out="reverbWet-p"></div></div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-panning-in"      data-in="panning"></div>     <span class="sp-lbl" id="lbl-panning-p">panning</span>    <div class="sp-dot" id="dot-panning-out"      data-out="panning-p"></div></div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-timbre-in"       data-in="timbre"></div>      <span class="sp-lbl" id="lbl-timbre-p">timbre</span>      <div class="sp-dot" id="dot-timbre-out"       data-out="timbre-p"></div></div>
        <div class="sp-row param-row"><div class="sp-dot" id="dot-noteOn-in"       data-in="noteOn"></div>      <span class="sp-lbl" id="lbl-noteOn-p">note trigger</span><div class="sp-dot" id="dot-noteOn-out"       data-out="noteOn-p"></div></div>
      </div>

      <!-- col 3: instruments -->
      <div class="sp-col">
        <div class="sp-col-head">Instrument</div>
        <div class="sp-row inst-row"><div class="sp-dot" id="dot-pad-in"   data-in="pad">  </div><span class="sp-lbl">pad synth</span></div>
        <div class="sp-row inst-row"><div class="sp-dot" id="dot-pluck-in" data-in="pluck"></div><span class="sp-lbl">pluck</span></div>
        <div class="sp-row inst-row"><div class="sp-dot" id="dot-bass-in"  data-in="bass"> </div><span class="sp-lbl">bass drone</span></div>
        <div class="sp-row inst-row"><div class="sp-dot" id="dot-all-in"   data-in="all">  </div><span class="sp-lbl">— all —</span></div>

      <!-- SVG cable overlay -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
(function(){

  /* ══════════════════════════════════════════════════════
     GAME OF LIFE ENGINE
  ══════════════════════════════════════════════════════ */

  var STRUCTURE_THRESHOLD = 10;
  var ACCENT_COLOR        = '#d97647';
  var INK                 = '#1c1b17';
  var RESEED_EVERY        = 0;
  var INTRO_PAUSE         = 1200;
  var SEED                = 1;
  var NOISE               = 0;
  var STEP_MS             = 140;

  var RULES={
    Conway:{b:[3],s:[2,3]}, HighLife:{b:[3,6],s:[2,3]},
    DayNight:{b:[3,6,7,8],s:[3,4,6,7,8]}, Maze:{b:[3],s:[1,2,3,4,5]},
    Seeds:{b:[2],s:[]}, Replicator:{b:[1,3,5,7],s:[1,3,5,7]}
  };
  var bArr=[], sArr=[];
  function applyRule(name){ var r=RULES[name]; bArr=Array(9).fill(false); sArr=Array(9).fill(false);
    r.b.forEach(function(k){bArr[k]=true;}); r.s.forEach(function(k){sArr[k]=true;}); }
  applyRule('Conway');

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  var poster=document.getElementById('poster'), cv=document.getElementById('gol'), ctx=cv.getContext('2d');
  var cols=100, rows=67, cell, grid, jit, running=true, timer=null, introT=null, gen=0;
  var lastCompSize=null; // shared between draw() and sono metrics

  function fit(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    var w=poster.clientWidth, h=poster.clientHeight;
    cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    cell=w/cols; rows=Math.max(44,Math.round(h/cell));
  }
  function blank(){var g=[];for(var y=0;y<rows;y++)g.push(new Array(cols).fill(0));return g;}
  function set(g,y,x){if(y>=0&&y<rows&&x>=0&&x<cols)g[y][x]=1;}
  function copyGrid(){var g=[];for(var y=0;y<rows;y++)g.push(grid[y].slice());return g;}

  function placeWord(g){
    var off=document.createElement('canvas'); off.width=cols; off.height=rows;
    var o=off.getContext('2d');
    o.fillStyle='#fff'; o.fillRect(0,0,cols,rows);
    o.fillStyle='#000'; o.textAlign='center'; o.textBaseline='middle';
    var word='emergence', base=20;
    o.font='900 '+base+'px Arial, sans-serif';
    var w=o.measureText(word).width;
    var fs=Math.min(base*(cols*0.9)/w, rows*0.68);
    o.font='900 '+fs+'px Arial, sans-serif';
    o.fillText(word, cols/2, rows/2);
    var d=o.getImageData(0,0,cols,rows).data;
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){ if(d[(y*cols+x)*4]<128) set(g,y,x); }
    if(NOISE>0){ var rng=mulberry32(SEED|0), p=NOISE/100;
      for(var y2=0;y2<rows;y2++)for(var x2=0;x2<cols;x2++){ if(rng()<p) g[y2][x2]^=1; } }
  }
  function buildJit(){
    jit=[];for(var y=0;y<rows;y++){jit.push([]);for(var x=0;x<cols;x++)
      jit[y].push([(Math.random()-0.5)*cell*0.3,(Math.random()-0.5)*cell*0.3,0.33+Math.random()*0.13,0.78+Math.random()*0.22]);}
  }
  function seed(){ grid=blank(); placeWord(grid); buildJit(); gen=0; }

  function step(){
    var n=blank();
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      var c=0;
      for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue; var ny=y+dy,nx=x+dx;
        if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&grid[ny][nx])c++;
      }
      n[y][x]=(grid[y][x]?(sArr[c]?1:0):(bArr[c]?1:0));
    }
    grid=n;
  }
  function components(){
    var size=[],seen=[];
    for(var y=0;y<rows;y++){size.push(new Array(cols).fill(0));seen.push(new Array(cols).fill(0));}
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      if(grid[y][x] && !seen[y][x]){
        var stack=[[y,x]], cells=[]; seen[y][x]=1;
        while(stack.length){
          var p=stack.pop(); cells.push(p);
          for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){
            if(!dx&&!dy)continue; var ny=p[0]+dy,nx=p[1]+dx;
            if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&grid[ny][nx]&&!seen[ny][nx]){seen[ny][nx]=1;stack.push([ny,nx]);}
          }
        }
        for(var i=0;i<cells.length;i++) size[cells[i][0]][cells[i][1]]=cells.length;
      }
    }
    return size;
  }
  function countClusters(){
    var seen=[],count=0;
    for(var y=0;y<rows;y++) seen.push(new Array(cols).fill(0));
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++){
      if(grid[y][x]&&!seen[y][x]){
        count++;
        var stk=[[y,x]]; seen[y][x]=1;
        while(stk.length){
          var q=stk.pop();
          for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){
            if(!dy&&!dx) continue;
            var ny=q[0]+dy,nx=q[1]+dx;
            if(ny>=0&&ny<rows&&nx>=0&&nx<cols&&grid[ny][nx]&&!seen[ny][nx]){seen[ny][nx]=1;stk.push([ny,nx]);}
          }
        }
      }
    }
    return count;
  }
  function draw(){
    lastCompSize=components();
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++) if(grid[y][x]){
      var j=jit[y][x];
      ctx.fillStyle=(lastCompSize[y][x]>=STRUCTURE_THRESHOLD)?ACCENT_COLOR:INK;
      ctx.globalAlpha=j[3];
      ctx.beginPath();
      ctx.arc(x*cell+cell/2+j[0], y*cell+cell/2+j[1], cell*j[2], 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function loop(){
    var prevG = sonoOn ? copyGrid() : null;
    step(); gen++;
    if(RESEED_EVERY>0 && gen%RESEED_EVERY===0){ grid=blank(); placeWord(grid); }
    draw();
    if(sonoOn) sonoUpdate(prevG);
  }

  /* ══════════════════════════════════════════════════════
     SONIFICATION MODULE
  ══════════════════════════════════════════════════════ */

  /* ── definitions ── */
  var DS = [
    {id:'population',   label:'population'},
    {id:'birthRate',    label:'birth rate'},
    {id:'deathRate',    label:'death rate'},
    {id:'netChange',    label:'net change'},
    {id:'clusterCount', label:'cluster count'},
    {id:'centroidX',    label:'spatial drift'},
    {id:'colorRatio',   label:'color ratio'},
  ];
  var MP = [
    {id:'filterCutoff', range:[200,8000]},
    {id:'volume',       range:[-40,-6]},
    {id:'pitch',        range:[36,72]},
    {id:'reverbWet',    range:[0,0.85]},
    {id:'panning',      range:[-1,1]},
    {id:'timbre',       range:[0,1]},
    {id:'noteOn',       range:[0,1]},
  ];
  var INST_IDS = ['pad','pluck','bass','all'];
  var TR_LIST  = ['linear','log','exp','invert'];

  /* ── state ── */
  var sonoOn    = false;
  var sonoReady = false;
  var sonoAvgW  = 10;
  var sonoHist  = {}, sonoVal = {};
  DS.forEach(function(d){ sonoHist[d.id]=[]; sonoVal[d.id]=0.5; });

  /* ── patches ── */
  var nextPid = 0;
  function mkPatch(from,to,inst,tr){
    return {id:'p'+(++nextPid), from:from, to:to, inst:inst, tr:tr};
  }
  var sonoPatches = [
    mkPatch('population',   'filterCutoff', 'pad',   'linear'),
    mkPatch('birthRate',    'noteOn',       'pluck',  'linear'),
    mkPatch('deathRate',    'volume',       'bass',   'linear'),
    mkPatch('clusterCount', 'reverbWet',    'pad',    'linear'),
    mkPatch('centroidX',    'panning',      'all',    'linear'),
    mkPatch('colorRatio',   'timbre',       'pad',    'log'),
  ];

  /* ── Tone.js nodes ── */
  var tMaster, tPadSynth, tPadFilter, tPadReverb, tPadPanner;
  var tPluck, tPluckRev, tPluckPan;
  var tBass, tBassFilter, tBassPan;
  var PAD_CHORDS = [
    ['C3','G3','E4'],
    ['D3','A3','F#4'],
    ['E3','B3','G4'],
    ['G3','D4','B4'],
    ['A3','E4','C5'],
  ];
  var padChordIdx=-1, lastChordMs=0;

  function sonoInit(){
    if(sonoReady) return;
    tMaster = new Tone.Volume(-12).toDestination();

    // Pad: lush ambient chord
    tPadFilter = new Tone.Filter(800,'lowpass');
    tPadReverb = new Tone.Reverb({decay:4, wet:0.3});
    tPadReverb.generate();
    tPadPanner = new Tone.Panner(0);
    tPadSynth  = new Tone.PolySynth(Tone.Synth,{
      oscillator:{type:'triangle'},
      envelope:{attack:1.4, decay:0.4, sustain:0.82, release:3},
      volume:-18
    });
    tPadSynth.connect(tPadFilter);
    tPadFilter.connect(tPadPanner);
    tPadPanner.connect(tPadReverb);
    tPadReverb.connect(tMaster);
    setTimeout(function(){ tPadSynth.triggerAttack(PAD_CHORDS[0]); padChordIdx=0; }, 200);

    // Pluck: births ping
    tPluckRev = new Tone.Reverb({decay:1.2, wet:0.2});
    tPluckRev.generate();
    tPluckPan = new Tone.Panner(0);
    tPluck    = new Tone.PluckSynth({attackNoise:1, dampening:4000, resonance:0.96, volume:-20});
    tPluck.connect(tPluckPan);
    tPluckPan.connect(tPluckRev);
    tPluckRev.connect(tMaster);

    // Bass drone
    tBassFilter = new Tone.Filter(350,'lowpass');
    tBassPan    = new Tone.Panner(0);
    tBass       = new Tone.Synth({
      oscillator:{type:'sawtooth'},
      envelope:{attack:0.9, decay:0.1, sustain:0.95, release:2},
      volume:-30
    });
    tBass.connect(tBassFilter);
    tBassFilter.connect(tBassPan);
    tBassPan.connect(tMaster);
    setTimeout(function(){ tBass.triggerAttack('C2'); }, 400);

    // Recorder — taps from master output
    tRecorder = new Tone.Recorder();
    tMaster.connect(tRecorder);

    sonoReady = true;
  }

  function sonoSilence(){
    if(!sonoReady) return;
    tMaster.volume.rampTo(-96, 0.06); // cut fast
    tPadSynth.releaseAll();
    tBass.triggerRelease();
  }

  function sonoResume(){
    if(!sonoReady) return;
    var vol = parseInt(document.getElementById('sono-vol').value);
    tMaster.volume.rampTo(vol, 0.15);
    tPadSynth.triggerAttack(PAD_CHORDS[Math.max(0, padChordIdx)]);
    tBass.triggerAttack('C2');
  }

  /* ── default / random patches ── */
  function defaultPatches(){
    sonoPatches = [
      mkPatch('population',   'filterCutoff', 'pad',   'linear'),
      mkPatch('birthRate',    'noteOn',       'pluck',  'linear'),
      mkPatch('deathRate',    'volume',       'bass',   'linear'),
      mkPatch('clusterCount', 'reverbWet',    'pad',    'linear'),
      mkPatch('centroidX',    'panning',      'all',    'linear'),
      mkPatch('colorRatio',   'timbre',       'pad',    'log'),
    ];
    drawAllCables();
  }

  function randomPatches(){
    var count = 3 + Math.floor(Math.random() * 4); // 3–6 patches
    var srcs  = DS.slice().sort(function(){ return Math.random()-.5; }).slice(0, count);
    sonoPatches = srcs.map(function(d){
      var mp   = MP[Math.floor(Math.random()*MP.length)];
      var inst = INST_IDS[Math.floor(Math.random()*INST_IDS.length)];
      var tr   = TR_LIST[Math.floor(Math.random()*TR_LIST.length)];
      return mkPatch(d.id, mp.id, inst, tr);
    });
    drawAllCables();
  }

  var btnDefault = document.getElementById('btn-default');
  var btnRandom  = document.getElementById('btn-random');
  btnDefault.addEventListener('click', defaultPatches);
  btnRandom.addEventListener('click',  randomPatches);

  /* ── recording ── */
  var tRecorder = null;
  var isRecording = false;
  var recBtn = document.getElementById('rec-btn');

  function startRec(){
    if(!sonoReady || !tRecorder) return;
    tRecorder.start();
    isRecording = true;
    recBtn.textContent = '■ stop'; recBtn.classList.add('recording');
  }

  function audioBufferToWav(buf){
    var ch = buf.numberOfChannels, sr = buf.sampleRate, len = buf.length;
    var dataBytes = len * ch * 2; // 16-bit
    var ab = new ArrayBuffer(44 + dataBytes);
    var v  = new DataView(ab);
    function str(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
    str(0,'RIFF'); v.setUint32(4, 36+dataBytes, true);
    str(8,'WAVE'); str(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,ch,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*ch*2,true);
    v.setUint16(32,ch*2,true); v.setUint16(34,16,true);
    str(36,'data'); v.setUint32(40,dataBytes,true);
    var offset=44;
    for(var i=0;i<len;i++) for(var c=0;c<ch;c++){
      var s=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));
      v.setInt16(offset, s<0?s*0x8000:s*0x7FFF, true); offset+=2;
    }
    return new Blob([ab],{type:'audio/wav'});
  }

  function stopRec(){
    if(!isRecording || !tRecorder) return;
    isRecording = false;
    recBtn.textContent = '⏳ saving…'; recBtn.classList.remove('recording');
    tRecorder.stop().then(function(webmBlob){
      var reader = new FileReader();
      reader.readAsArrayBuffer(webmBlob);
      reader.onload = function(){
        var tmpCtx = new AudioContext();
        tmpCtx.decodeAudioData(reader.result, function(audioBuf){
          var wavBlob = audioBufferToWav(audioBuf);
          var url = URL.createObjectURL(wavBlob);
          var a   = document.createElement('a');
          a.href  = url;
          a.download = 'emergence-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.wav';
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
          tmpCtx.close();
          recBtn.textContent = '● rec';
        });
      };
    });
  }

  recBtn.addEventListener('click', function(){
    if(!sonoOn) return;
    isRecording ? stopRec() : startRec();
  });

  function sonoReset(){
    if(!sonoOn || !sonoReady) return;
    // clear history so old values don't bleed into new run
    DS.forEach(function(d){ sonoHist[d.id]=[]; sonoVal[d.id]=0.5; });
    padChordIdx=-1; lastChordMs=0;
    // silence, then restart drones after the intro pause
    tPadSynth.releaseAll();
    tBass.triggerRelease();
    setTimeout(function(){
      tPadSynth.triggerAttack(PAD_CHORDS[0]); padChordIdx=0;
      tBass.triggerAttack('C2');
    }, INTRO_PAUSE + 200);
  }

  /* ── smoothing ── */
  function sonoSmooth(id, raw){
    sonoHist[id].push(raw);
    if(sonoHist[id].length > sonoAvgW) sonoHist[id].shift();
    var sum=0; sonoHist[id].forEach(function(v){sum+=v;});
    sonoVal[id] = sum / sonoHist[id].length;
  }

  /* ── metrics ── */
  function computeMetrics(prevGrid){
    var total=rows*cols, live=0, births=0, deaths=0, accentC=0, sumX=0;
    for(var y=0;y<rows;y++) for(var x=0;x<cols;x++){
      var cur=grid[y][x], prev=prevGrid?prevGrid[y][x]:0;
      if(cur){ live++; sumX+=x; }
      if(cur&&!prev) births++;
      if(!cur&&prev) deaths++;
      if(cur && lastCompSize && lastCompSize[y][x]>=STRUCTURE_THRESHOLD) accentC++;
    }
    var nc = countClusters();
    sonoSmooth('population',   Math.min(live/total/0.3, 1));
    sonoSmooth('birthRate',    Math.min(births/Math.max(live,1)/0.15, 1));
    sonoSmooth('deathRate',    Math.min(deaths/Math.max(live,1)/0.15, 1));
    sonoSmooth('netChange',    Math.max(0, Math.min(1, ((births-deaths)/Math.max(live,1)+0.15)/0.3)));
    sonoSmooth('clusterCount', Math.min(nc/40, 1));
    sonoSmooth('centroidX',    live>0 ? sumX/(live*cols) : 0.5);
    sonoSmooth('colorRatio',   live>0 ? accentC/live : 0);
    // raw birth rate for discrete triggers (unsmoothed)
    return { birthRaw: births/Math.max(live,1) };
  }

  /* ── transforms ── */
  function applyTr(v, tr){
    v = Math.max(0, Math.min(1, v));
    if(tr==='log')    return Math.log(v*9+1)/Math.log(10);
    if(tr==='exp')    return v*v;
    if(tr==='invert') return 1-v;
    return v;
  }
  function mapRange(v, id){
    var p = MP.find(function(m){return m.id===id;});
    if(!p) return v;
    return p.range[0] + v*(p.range[1]-p.range[0]);
  }

  /* ── apply a single patch to audio ── */
  var PENTA = ['C4','D4','E4','G4','A4','C5','E5','G5'];
  function applyPatch(patch, raw){
    if(!sonoReady) return;
    var v = applyTr(sonoVal[patch.from], patch.tr);
    var m = mapRange(v, patch.to);
    var inst = patch.inst;
    var ramp = 0.15;

    switch(patch.to){
      case 'filterCutoff':
        if(inst==='pad'||inst==='all')  tPadFilter.frequency.rampTo(m, ramp);
        if(inst==='bass'||inst==='all') tBassFilter.frequency.rampTo(m, ramp);
        break;
      case 'volume':
        if(inst==='pad'||inst==='all')   tPadSynth.volume.rampTo(m, ramp);
        if(inst==='bass'||inst==='all')  tBass.volume.rampTo(m, ramp);
        if(inst==='pluck'||inst==='all') tPluck.volume.rampTo(m, ramp);
        break;
      case 'pitch':
        if(inst==='bass'||inst==='all'){
          var freq = Tone.Frequency(Math.round(m),'midi').toFrequency();
          tBass.frequency.rampTo(freq, 0.6);
        }
        break;
      case 'reverbWet':
        if(inst==='pad'||inst==='all')   tPadReverb.wet.rampTo(m, 0.4);
        if(inst==='pluck'||inst==='all') tPluckRev.wet.rampTo(m, 0.4);
        break;
      case 'panning':
        if(inst==='pad'||inst==='all')   tPadPanner.pan.rampTo(m, ramp);
        if(inst==='pluck'||inst==='all') tPluckPan.pan.rampTo(m, ramp);
        if(inst==='bass'||inst==='all')  tBassPan.pan.rampTo(m, ramp);
        break;
      case 'timbre':
        // use detune on pad as proxy for harmonic richness
        tPadSynth.set({detune: v*18});
        break;
      case 'noteOn':
        // discrete: fire pluck notes proportional to raw birth rate
        if(raw && raw.birthRaw > 0.04){
          var count = Math.min(3, Math.ceil(raw.birthRaw * 12));
          for(var i=0; i<count; i++){
            var note = PENTA[Math.floor(Math.random()*PENTA.length)];
            tPluck.triggerAttack(note, '+' + (i*0.06).toFixed(2));
          }
        }
        break;
    }
  }

  /* ── evolve pad chord based on cluster count ── */
  function updatePadChord(){
    if(!sonoReady) return;
    var now = Date.now();
    if(now - lastChordMs < 3500) return;
    var idx = Math.min(Math.floor(sonoVal.clusterCount * PAD_CHORDS.length), PAD_CHORDS.length-1);
    if(idx === padChordIdx) return;
    padChordIdx = idx; lastChordMs = now;
    tPadSynth.releaseAll('+0.7');
    var chord = PAD_CHORDS[idx];
    setTimeout(function(){ tPadSynth.triggerAttack(chord); }, 850);
  }

  /* ── main update (called from loop) ── */
  function sonoUpdate(prevGrid){
    if(!sonoOn || !sonoReady) return;
    var raw = computeMetrics(prevGrid);
    sonoPatches.forEach(function(p){ applyPatch(p, raw); });
    updatePadChord();
  }

  /* ══════════════════════════════════════════════════════
     PATCH CABLE UI
  ══════════════════════════════════════════════════════ */

  var svgEl   = document.getElementById('sono-svg');
  var bodyEl  = document.getElementById('sono-body');
  var cDrag   = null; // {startDot, startX, startY, ghostEl, kind}

  function sonoResizeSVG(){
    var r = bodyEl.getBoundingClientRect();
    svgEl.setAttribute('width',  r.width);
    svgEl.setAttribute('height', r.height);
  }

  function getDotPos(dot){
    var sr = svgEl.getBoundingClientRect();
    var dr = dot.getBoundingClientRect();
    return { x: dr.left + dr.width/2 - sr.left, y: dr.top + dr.height/2 - sr.top };
  }

  function bezier(x1,y1,x2,y2){
    var dx = Math.abs(x2-x1)*0.55;
    return 'M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;
  }

  function drawPatch(patch){
    var fromDot = document.getElementById('dot-'+patch.from+'-out');
    var toDot   = document.getElementById('dot-'+patch.to+'-in');
    if(!fromDot||!toDot) return;

    // remove existing
    var old = document.getElementById('cable-'+patch.id);
    if(old) old.remove();

    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.id = 'cable-'+patch.id;

    var p1=getDotPos(fromDot), p2=getDotPos(toDot);

    // main cable (data → param)
    var path1 = document.createElementNS('http://www.w3.org/2000/svg','path');
    path1.setAttribute('d', bezier(p1.x,p1.y,p2.x,p2.y));
    path1.setAttribute('stroke','#d97647');
    path1.setAttribute('stroke-width','2');
    path1.setAttribute('fill','none');
    path1.setAttribute('opacity','0.85');
    g.appendChild(path1);

    // transform badge at midpoint
    var mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    var bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x', mx-24); bg.setAttribute('y', my-9);
    bg.setAttribute('width',48); bg.setAttribute('height',18);
    bg.setAttribute('rx',3);
    bg.setAttribute('fill','#f5f3ea');
    bg.setAttribute('stroke','#1a1410');
    bg.setAttribute('stroke-width','1.5');
    g.appendChild(bg);

    var txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',mx); txt.setAttribute('y',my+4);
    txt.setAttribute('text-anchor','middle');
    txt.setAttribute('font-family','"Space Mono",monospace');
    txt.setAttribute('font-size','8');
    txt.setAttribute('font-weight','700');
    txt.setAttribute('fill','#1a1410');
    txt.setAttribute('letter-spacing','0.05em');
    txt.textContent = patch.tr.toUpperCase();
    g.appendChild(txt);

    // invisible hit area for badge
    var hit = document.createElementNS('http://www.w3.org/2000/svg','rect');
    hit.setAttribute('x', mx-24); hit.setAttribute('y', my-9);
    hit.setAttribute('width',48); hit.setAttribute('height',18);
    hit.setAttribute('fill','transparent');
    hit.setAttribute('class','cbadge-hit');
    hit.dataset.pid = patch.id;
    g.appendChild(hit);

    // instrument cable (param → inst) — dashed
    if(patch.inst && patch.inst !== 'all'){
      var paramOut = document.getElementById('dot-'+patch.to+'-out');
      var instIn   = document.getElementById('dot-'+patch.inst+'-in');
      if(paramOut && instIn){
        var p3=getDotPos(paramOut), p4=getDotPos(instIn);
        var path2 = document.createElementNS('http://www.w3.org/2000/svg','path');
        path2.setAttribute('d', bezier(p3.x,p3.y,p4.x,p4.y));
        path2.setAttribute('stroke','rgba(26,20,16,0.45)');
        path2.setAttribute('stroke-width','1.5');
        path2.setAttribute('stroke-dasharray','5,3');
        path2.setAttribute('fill','none');
        g.appendChild(path2);
        instIn.classList.add('lit');
      }
    }

    svgEl.appendChild(g);
    fromDot.classList.add('lit');
    toDot.classList.add('lit');

    // light up param labels
    var lbl = document.getElementById('lbl-'+patch.from);
    if(lbl) lbl.classList.add('lit');
  }

  function drawAllCables(){
    // clear old
    while(svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
    // reset dot/label states
    document.querySelectorAll('.sp-dot').forEach(function(d){ d.classList.remove('lit'); });
    document.querySelectorAll('.sp-lbl').forEach(function(l){ l.classList.remove('lit'); });
    sonoPatches.forEach(drawPatch);
  }

  function removePatch(pid){
    var idx = sonoPatches.findIndex(function(p){return p.id===pid;});
    if(idx<0) return;
    sonoPatches.splice(idx,1);
    drawAllCables();
  }

  function cyclePatchTransform(pid){
    var patch = sonoPatches.find(function(p){return p.id===pid;});
    if(!patch) return;
    var i = TR_LIST.indexOf(patch.tr);
    patch.tr = TR_LIST[(i+1) % TR_LIST.length];
    drawAllCables();
  }

  /* ── badge click / double-click (event delegation on SVG) ── */
  svgEl.addEventListener('click', function(e){
    if(e.target.classList.contains('cbadge-hit')){
      cyclePatchTransform(e.target.dataset.pid);
    }
  });
  svgEl.addEventListener('dblclick', function(e){
    if(e.target.classList.contains('cbadge-hit')){
      removePatch(e.target.dataset.pid);
    }
  });
  // enable pointer events on SVG for badges only (hits)
  svgEl.style.pointerEvents = 'none';
  svgEl.addEventListener('click',    function(e){ if(e.target.classList.contains('cbadge-hit')) e.stopPropagation(); }, true);

  /* ── drag to create patches ── */
  bodyEl.addEventListener('mousedown', function(e){
    var dot = e.target.closest('[data-out]');
    if(!dot) return;
    e.preventDefault();
    var sp = getDotPos(dot);
    var ghost = document.createElementNS('http://www.w3.org/2000/svg','path');
    ghost.setAttribute('stroke','#d97647');
    ghost.setAttribute('stroke-width','2');
    ghost.setAttribute('fill','none');
    ghost.setAttribute('stroke-dasharray','6,3');
    ghost.setAttribute('opacity','0.55');
    ghost.id = 'ghost-cable';
    svgEl.appendChild(ghost);
    svgEl.style.pointerEvents = 'none'; // allow mousemove to pass through
    cDrag = { dot:dot, sx:sp.x, sy:sp.y, ghost:ghost };
  });

  document.addEventListener('mousemove', function(e){
    if(!cDrag) return;
    var sr = svgEl.getBoundingClientRect();
    var mx = e.clientX-sr.left, my = e.clientY-sr.top;
    cDrag.ghost.setAttribute('d', bezier(cDrag.sx, cDrag.sy, mx, my));
  });

  document.addEventListener('mouseup', function(e){
    if(!cDrag) return;
    var ghost = cDrag.ghost;
    var srcOut = cDrag.dot.dataset.out; // e.g. "population" or "filterCutoff-p"
    cDrag = null;
    ghost.remove();

    var tgt = document.elementFromPoint(e.clientX, e.clientY);
    if(!tgt) return;
    var tDot = tgt.closest('[data-in]');
    if(!tDot) return;
    var destIn = tDot.dataset.in; // e.g. "filterCutoff" or "pad"

    var srcIsData  = DS.some(function(d){return d.id===srcOut;});
    var srcIsParam = srcOut.endsWith('-p');
    var destIsParam = MP.some(function(m){return m.id===destIn;});
    var destIsInst  = INST_IDS.indexOf(destIn)>=0;

    if(srcIsData && destIsParam){
      // new data→param patch
      var patch = mkPatch(srcOut, destIn, 'pad', 'linear');
      sonoPatches.push(patch);
      drawAllCables();
    } else if(srcIsParam && destIsInst){
      // update instrument for all patches going to this param
      var paramId = srcOut.replace('-p','');
      sonoPatches.forEach(function(p){
        if(p.to===paramId) p.inst = destIn;
      });
      drawAllCables();
    }
  });

  /* ── touch support for patch cable drag ── */
  function touchPos(e){ var t=e.touches[0]||e.changedTouches[0]; return {clientX:t.clientX, clientY:t.clientY}; }

  bodyEl.addEventListener('touchstart', function(e){
    var dot = e.target.closest('[data-out]');
    if(!dot) return;
    e.preventDefault();
    var sp = getDotPos(dot);
    var ghost = document.createElementNS('http://www.w3.org/2000/svg','path');
    ghost.setAttribute('stroke','#d97647'); ghost.setAttribute('stroke-width','2');
    ghost.setAttribute('fill','none'); ghost.setAttribute('stroke-dasharray','6,3');
    ghost.setAttribute('opacity','0.55'); ghost.id='ghost-cable';
    svgEl.appendChild(ghost);
    cDrag = { dot:dot, sx:sp.x, sy:sp.y, ghost:ghost };
  }, {passive:false});

  document.addEventListener('touchmove', function(e){
    if(!cDrag) return;
    e.preventDefault();
    var pos = touchPos(e);
    var sr = svgEl.getBoundingClientRect();
    var mx = pos.clientX-sr.left, my = pos.clientY-sr.top;
    cDrag.ghost.setAttribute('d', bezier(cDrag.sx, cDrag.sy, mx, my));
  }, {passive:false});

  document.addEventListener('touchend', function(e){
    if(!cDrag) return;
    var ghost = cDrag.ghost, srcOut = cDrag.dot.dataset.out;
    cDrag = null; ghost.remove();
    var pos = touchPos(e);
    var tgt = document.elementFromPoint(pos.clientX, pos.clientY);
    if(!tgt) return;
    var tDot = tgt.closest('[data-in]');
    if(!tDot) return;
    var destIn = tDot.dataset.in;
    var srcIsData  = DS.some(function(d){ return d.id===srcOut; });
    var srcIsParam = srcOut.endsWith('-p');
    var destIsParam = MP.some(function(m){ return m.id===destIn; });
    var destIsInst  = INST_IDS.indexOf(destIn)>=0;
    if(srcIsData && destIsParam){
      sonoPatches.push(mkPatch(srcOut, destIn, 'pad', 'linear'));
      drawAllCables();
    } else if(srcIsParam && destIsInst){
      var paramId = srcOut.replace('-p','');
      sonoPatches.forEach(function(p){ if(p.to===paramId) p.inst=destIn; });
      drawAllCables();
    }
  });

  /* ── resume AudioContext when page regains focus (iOS suspends it) ── */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && sonoOn){
      Tone.start();
    }
  });

  /* ── click input dot to disconnect ── */
  bodyEl.addEventListener('click', function(e){
    if(cDrag) return;
    var dot = e.target.closest('[data-in]');
    if(!dot || !dot.classList.contains('lit')) return;
    var destId = dot.dataset.in;
    var isParam = MP.some(function(m){ return m.id===destId; });
    var isInst  = INST_IDS.indexOf(destId)>=0;
    if(isParam){
      sonoPatches = sonoPatches.filter(function(p){ return p.to!==destId; });
    } else if(isInst){
      sonoPatches.forEach(function(p){ if(p.inst===destId) p.inst='all'; });
    }
    drawAllCables();
  });

  /* ── sonification toggle ── */
  document.getElementById('sono-toggle').addEventListener('click', function(){
    if(!sonoOn){
      var self = this;
      Tone.start().then(function(){
        sonoInit();
        sonoResume();
        sonoOn = true;
        self.textContent = 'on';
        self.classList.add('on');
        document.getElementById('sono-panel').classList.remove('sono-off');
        recBtn.disabled = false;
        btnDefault.disabled = false;
        btnRandom.disabled  = false;
        sonoResizeSVG();
        drawAllCables();
      });
    } else {
      sonoOn = false;
      sonoSilence();
      if(isRecording) stopRec();
      recBtn.disabled     = true;
      btnDefault.disabled = true;
      btnRandom.disabled  = true;
      this.textContent = 'off';
      this.classList.remove('on');
      document.getElementById('sono-panel').classList.add('sono-off');
    }
  });

  /* ── smooth slider ── */
  document.getElementById('sono-avg').addEventListener('input', function(){
    sonoAvgW = parseInt(this.value);
    document.getElementById('sono-avgV').textContent = sonoAvgW;
    DS.forEach(function(d){ sonoHist[d.id]=[]; });
  });

  /* ── volume slider ── */
  document.getElementById('sono-vol').addEventListener('input', function(){
    var v = parseInt(this.value);
    document.getElementById('sono-volV').textContent = (v>=0?'+':'')+v;
    if(sonoReady) tMaster.volume.rampTo(v, 0.1);
  });

  /* ── redraw cables on resize ── */
  sonoResizeSVG();

  start();
})();
</script>
</body>
</html>
