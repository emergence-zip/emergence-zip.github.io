<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMERGENCE — soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CSS CUSTOM PROPERTIES — default values
   Each theme overrides only what it needs.
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
:root {
  --ink:    #0c0e17;
  --ink2:   #15182a;
  --bone:   #e9e2cf;
  --orange: #ff5a2c;
  --pink:   #ff2e74;
  --teal:   #1fae9a;
  --steel:  #5a6f86;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   THEME: retro_japanese_pulp
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
[data-theme="retro_japanese_pulp"] {
  --ink:    #e8d8c9;
  --ink2:   #d8c8b8;
  --bone:   #1a1410;
  --orange: #f3701e;
  --pink:   #f3701e;
  --teal:   #4b607f;
  --steel:  #6a8099;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   BASE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "Space Mono", monospace;
  color: var(--bone);
  background: var(--ink);
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
  transition: background .35s ease, color .35s ease, opacity .18s ease;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   THEME LAYER — receives each theme's objects
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
#theme-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DEFAULT THEME — decorative elements
   (styles defined here, HTML injected by JS)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.bg {
  position: fixed; inset: -10%; z-index: 0;
  background:
    radial-gradient(60% 55% at 78% 22%,
      #3a1c10 0%,  #3a1c10 14%,
      #25131f 14%, #25131f 30%,
      #181426 30%, #181426 50%,
      var(--ink2) 50%, var(--ink2) 72%,
      var(--ink) 72%);
  filter: saturate(1.1);
}
.space { position: fixed; inset: 0; z-index: 1; }
.pl { position: absolute; animation: drift 22s ease-in-out infinite; }
.pl.big   { bottom: -26vh; left: -12vw; width: min(80vh, 640px); animation-duration: 40s; }
.pl.mid   { top: 8vh; right: 6vw; width: min(26vh, 200px); animation-delay: -6s; }
.pl.small { top: 54vh; right: 24vw; width: min(11vh, 90px); animation-delay: -12s; animation-duration: 30s; }
.dither {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='4' height='4'><circle cx='1' cy='1' r='0.8' fill='white'/></svg>");
  background-size: 3px 3px; mix-blend-mode: overlay; opacity: .5;
}
.dither.coarse {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6'><circle cx='3' cy='3' r='1' fill='black'/></svg>");
  background-size: 6px 6px; mix-blend-mode: multiply; opacity: .35;
}
.grain {
  position: fixed; inset: -50%; z-index: 7; pointer-events: none;
  opacity: .22; mix-blend-mode: screen;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation: judder .4s steps(3) infinite;
}
.vig {
  position: fixed; inset: 0; z-index: 6; pointer-events: none;
  background: radial-gradient(120% 110% at 50% 45%, transparent 55%, rgba(0,0,0,.7) 100%);
}
/* hide default overlays in fanzine */
[data-theme="retro_japanese_pulp"] .vig,
[data-theme="retro_japanese_pulp"] .grain { display: none; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RETRO_JAPANESE_PULP THEME — decorative elements
   (styles here, HTML injected by JS)
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

/* grid + erased patches now live inside #theme-layer (see objects HTML)
   so they stack correctly below the floating objects */
.fz-grid {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M 20 0 L 0 0 0 20' fill='none' stroke='%231a1410' stroke-width='0.5' opacity='0.15'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><path d='M 100 0 L 0 0 0 100' fill='none' stroke='%231a1410' stroke-width='0.9' opacity='0.20'/></svg>");
}
.fz-patches {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 22% at  6% 88%, #e8d8c9 25%, rgba(232,216,201,0) 100%),
    radial-gradient(ellipse 24% 18% at 92%  9%, #e8d8c9 20%, rgba(232,216,201,0) 100%),
    radial-gradient(ellipse 18% 24% at 80% 60%, #e8d8c9 18%, rgba(232,216,201,0) 100%),
    radial-gradient(ellipse 14% 10% at 42% 24%, #e8d8c9 30%, rgba(232,216,201,0) 100%),
    radial-gradient(ellipse 16% 12% at 55% 82%, #e8d8c9 22%, rgba(232,216,201,0) 100%),
    radial-gradient(ellipse 10% 14% at 22% 55%, #e8d8c9 15%, rgba(232,216,201,0) 100%),
    linear-gradient(to right, rgba(26,20,16,0.08) 0%, rgba(26,20,16,0.02) 6%, rgba(26,20,16,0) 14%),
    radial-gradient(ellipse 55% 45% at 98% 4%,  rgba(26,20,16,0.07) 0%, rgba(26,20,16,0) 100%),
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(232,216,201,0) 40%, rgba(205,192,180,0.18) 100%);
}
/* inner frame border */
.fz-border {
  position: fixed; inset: 10px; z-index: 8; pointer-events: none;
  border: 2px solid #1a1410; display: none;
}
[data-theme="retro_japanese_pulp"] .fz-border { display: block; }

/* floating object positions */
.fz-obj { position: fixed; z-index: 3; pointer-events: none; }
.fz-obj.ctrl { top: 5%;   left: 2%;   animation: drA 22s ease-in-out infinite; }
.fz-obj.disk { bottom: 8%; right: 20%; animation: drB 26s ease-in-out infinite; pointer-events: auto; cursor: pointer; }
.fz-obj.can  { top: 47%;  left: 0%;   animation: drC 17s ease-in-out infinite; }
.fz-obj.ash  { top: 13%;  right: 10%; animation: drD 23s ease-in-out infinite; }

/* speed lines + hatch */
.fz-speedlines {
  position: fixed; top: 0; right: 0;
  width: 220px; height: 220px; z-index: 2; opacity: .1; pointer-events: none;
}
.fz-hatch {
  position: fixed; bottom: 0; left: 0;
  width: 180px; height: 180px; z-index: 2; opacity: .07; pointer-events: none;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   MAIN CONTENT — identical across themes,
   only colour vars change
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
main {
  position: relative; z-index: 5;
  text-align: center; padding: 0 1.4rem; max-width: 760px;
}

/* tag — hidden in default, shown in retro_japanese_pulp */
.tag {
  font-size: .72rem; letter-spacing: .5em; text-transform: uppercase;
  color: var(--orange); font-weight: 700; display: none;
  margin-bottom: 1rem; border: 2px solid var(--orange);
  padding: .45rem .8rem .4rem;
}
[data-theme="retro_japanese_pulp"] .tag { display: inline-block; }

/* h1 */
h1 {
  font-family: "Anton", sans-serif; font-weight: 400;
  font-size: clamp(3.6rem, 17vw, 10rem); line-height: .86; letter-spacing: .01em;
  text-transform: uppercase; color: var(--bone);
  text-shadow: .06em .04em 0 var(--orange), -.05em -.03em 0 var(--teal);
  animation: glitch 5.5s steps(2) infinite;
  margin: .2rem 0 1.3rem;
}
[data-theme="retro_japanese_pulp"] h1 {
  text-shadow: 6px 5px 0 var(--orange), -3px -2px 0 var(--teal);
  animation: none;
}

/* manifesto */
.manifesto {
  list-style: none; margin: 0 auto; max-width: 32rem;
  text-align: left; display: flex; flex-direction: column; gap: .5rem;
}
.manifesto li {
  display: flex; align-items: baseline; gap: .85rem;
  opacity: 0; animation: cut .1s steps(1) forwards;
}
.manifesto .n {
  font-family: "Anton", sans-serif; color: var(--orange);
  font-size: 1.05rem; min-width: 1.3em; text-align: right; flex: none;
  text-shadow: .04em .03em 0 rgba(31,174,154,.6);
}
.manifesto .bar {
  font-family: "Space Mono", monospace; font-weight: 700;
  color: var(--bone); opacity: .72; letter-spacing: .05em; line-height: 1;
  font-size: clamp(.62rem, 2.3vw, .95rem); white-space: nowrap; overflow: hidden;
  text-shadow: .045em 0 0 rgba(255,90,44,.55);
}
[data-theme="retro_japanese_pulp"] .manifesto li  { opacity: 1; animation: none; }
[data-theme="retro_japanese_pulp"] .manifesto .n  { text-shadow: none; }
[data-theme="retro_japanese_pulp"] .manifesto .bar {
  opacity: 1; text-shadow: none; display: inline-block;
}

/* soon */
.soon {
  margin-top: 2.4rem; display: inline-flex; align-items: center; gap: .7rem;
  font-family: "Anton", sans-serif; font-size: 1.4rem; letter-spacing: .35em;
  text-transform: uppercase; color: var(--pink);
  opacity: 0; animation: cut .1s steps(1) 1.5s forwards;
}
.soon .cur {
  display: inline-block; width: .6em; height: 1.05em; background: var(--orange);
  animation: blink 1s steps(1) infinite;
}
.soon-jp {
  display: none; font-family: "Noto Sans JP", "Space Mono", monospace;
  font-size: .54rem; letter-spacing: .2em; color: var(--teal); font-weight: 700;
}
[data-theme="retro_japanese_pulp"] .soon {
  opacity: 1; animation: none;
  flex-direction: column; gap: 3px;
  border: 3.5px solid var(--orange);
  padding: 7px 20px 6px; transform: rotate(-2deg);
}
[data-theme="retro_japanese_pulp"] .soon .cur { display: none; }
[data-theme="retro_japanese_pulp"] .soon-jp    { display: block; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   THEME KNOB
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.theme-btn {
  position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 20;
  cursor: pointer; border: none; background: none; padding: 0;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  user-select: none;
}
.theme-btn:focus-visible { outline: 2px solid var(--orange); border-radius: 50%; }
.theme-knob-img {
  width: 72px; height: 61px;
  transition: transform .55s cubic-bezier(.34,1.3,.64,1);
  transform-origin: center center;
  display: block;
}
.theme-btn .main-lbl {
  font-family: "Space Mono", monospace; font-size: .52rem;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--orange); font-weight: 700;
  text-shadow: none; opacity: .85;
  transition: color .35s ease;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   KEYFRAMES
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@keyframes drift  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(2.2vw,-1.6vh); } }
@keyframes drA    { 0%,100% { transform: translate(0,0) rotate(-8deg); }  50% { transform: translate(14px,-18px) rotate(-1deg); } }
@keyframes drB    { 0%,100% { transform: translate(0,0) rotate(4deg); }   50% { transform: translate(-12px,12px) rotate(12deg); } }
@keyframes drC    { 0%,100% { transform: translate(0,0) rotate(-20deg); } 50% { transform: translate(10px,-22px) rotate(-11deg); } }
@keyframes drD    { 0%,100% { transform: translate(0,0) rotate(9deg); }   50% { transform: translate(-9px,14px) rotate(2deg); } }
@keyframes judder { to { transform: translate(3%,2%); } }
@keyframes blink  { 50% { opacity: 0; } }
@keyframes cut    { to  { opacity: 1; } }
@keyframes glitch {
  0%,92%,100% { text-shadow: .06em .04em 0 var(--orange), -.05em -.03em 0 var(--teal); transform: translate(0); }
  93%  { text-shadow: -.08em 0 0 var(--pink),  .07em 0 0 var(--teal);   transform: translate(-2px, 1px); }
  95%  { text-shadow:  .09em -.02em 0 var(--orange), -.06em .03em 0 var(--pink); transform: translate(2px,-1px); }
  97%  { text-shadow:  .06em  .04em 0 var(--orange), -.05em -.03em 0 var(--teal); transform: translate(0); }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .soon, .manifesto li { opacity: 1; }
}
</style>
</head>

<body data-theme="default">

  <!-- injected per theme: backgrounds, planets / fanzine objects -->
  <div id="theme-layer"></div>

  <!-- persistent overlays (shown/hidden via CSS per theme) -->
  <div class="fz-border"></div>
  <div class="vig"></div>
  <div class="grain"></div>

  <!-- ── content — never changes ── -->
  <main>
    <span class="tag">&#9658;&nbsp;&#12456;&#12510;&#12540;&#12472;&#12455;&#12531;&#12473;&nbsp;&#9668;&nbsp;EMERGENCE&nbsp;&#9658;</span>
    <h1>Emergence</h1>
    <ol class="manifesto">
      <li style="animation-delay:1.2s" ><span class="n">1</span><span class="bar">##################################</span></li>
      <li style="animation-delay:1.32s"><span class="n">2</span><span class="bar">#############################</span></li>
      <li style="animation-delay:1.44s"><span class="n">3</span><span class="bar">#######################################</span></li>
      <li style="animation-delay:1.56s"><span class="n">4</span><span class="bar">################################</span></li>
      <li style="animation-delay:1.68s"><span class="n">5</span><span class="bar">#######################</span></li>
    </ol>
    <div class="soon">Soon<span class="cur"></span><span class="soon-jp">&#12414;&#12418;&#12394;&#12367;</span></div>
  </main>

  <!-- ── theme knob ── -->
  <button class="theme-btn" id="themebtn" aria-label="Switch colour theme">
    <img class="theme-knob-img" id="knob-img"
         src="assets/knob_custom.svg"
         alt="Theme selector knob" draggable="false">
    <span class="main-lbl" id="theme-label">DEFAULT</span>
  </button>

<script>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   THEME REGISTRY
   To add a new theme:
     1. Add a CSS block above: [data-theme="my_theme"] { ... }
     2. Add an entry here with label, objects HTML, onEnter, onLeave
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const THEMES = {

  /* ── default ──────────────────────────────── */
  default: {
    label: 'DEFAULT',

    objects: `
      <div class="bg"></div>

      <svg class="space" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <pattern id="dot" width="5" height="5" patternUnits="userSpaceOnUse">
            <rect width="5" height="5" fill="transparent"/>
            <circle cx="1.2" cy="1.2" r="1.2" fill="#0c0e17"/>
          </pattern>
          <pattern id="dotfine" width="3" height="3" patternUnits="userSpaceOnUse">
            <circle cx="0.8" cy="0.8" r="0.8" fill="#0c0e17"/>
          </pattern>
          <radialGradient id="sun" cx="78%" cy="22%" r="60%">
            <stop offset="0%"  stop-color="#ffd27a"/>
            <stop offset="22%" stop-color="#ff7a30"/>
            <stop offset="45%" stop-color="#ff5a2c"/>
            <stop offset="46%" stop-color="transparent"/>
          </radialGradient>
        </defs>
        <circle cx="1124" cy="198" r="640" fill="url(#sun)" opacity="0.5"/>
        <circle cx="1124" cy="198" r="34"  fill="#ffe6a8"/>
        <circle cx="1124" cy="198" r="60"  fill="none" stroke="#ff7a30" stroke-width="2" opacity=".6"/>
        <g id="stars"></g>
      </svg>

      <svg class="pl big" viewBox="0 0 400 400" aria-hidden="true">
        <circle cx="200" cy="200" r="190" fill="#1c2b3a"/>
        <circle cx="200" cy="200" r="190" fill="#2a4a5e"/>
        <clipPath id="cBig"><circle cx="200" cy="200" r="190"/></clipPath>
        <g clip-path="url(#cBig)">
          <circle cx="120" cy="120" r="230" fill="#3f6e7e"/>
          <circle cx="90"  cy="95"  r="150" fill="#6fae9e"/>
          <circle cx="300" cy="300" r="280" fill="url(#dot)"     opacity=".9"/>
          <circle cx="340" cy="330" r="260" fill="#0c0e17"       opacity=".85"/>
          <ellipse cx="200" cy="150" rx="200" ry="16" fill="#173043" opacity=".5"/>
          <ellipse cx="200" cy="240" rx="200" ry="22" fill="#173043" opacity=".4"/>
          <circle cx="150" cy="180" r="26"  fill="url(#dotfine)" opacity=".5"/>
        </g>
        <circle cx="200" cy="200" r="189" fill="none" stroke="#0c0e17" stroke-width="2"/>
      </svg>

      <svg class="pl mid" viewBox="0 0 300 200" aria-hidden="true">
        <ellipse cx="150" cy="100" rx="135" ry="34" fill="none" stroke="#ff5a2c" stroke-width="8" opacity=".55"/>
        <clipPath id="cMid"><circle cx="150" cy="100" r="62"/></clipPath>
        <circle cx="150" cy="100" r="62" fill="#b8482a"/>
        <g clip-path="url(#cMid)">
          <circle cx="120" cy="72"  r="60" fill="#ff7a30"/>
          <circle cx="105" cy="62"  r="34" fill="#ffd27a"/>
          <circle cx="200" cy="150" r="90" fill="url(#dot)" opacity=".9"/>
          <circle cx="220" cy="160" r="80" fill="#0c0e17"   opacity=".8"/>
        </g>
        <circle cx="150" cy="100" r="62"   fill="none" stroke="#0c0e17" stroke-width="2"/>
        <ellipse cx="150" cy="100" rx="135" ry="34" fill="none" stroke="#ff5a2c"
          stroke-width="3" stroke-dasharray="200 400" opacity=".9"/>
      </svg>

      <svg class="pl small" viewBox="0 0 120 120" aria-hidden="true">
        <clipPath id="cSm"><circle cx="60" cy="60" r="52"/></clipPath>
        <circle cx="60" cy="60" r="52" fill="#7c8a9c"/>
        <g clip-path="url(#cSm)">
          <circle cx="42" cy="44" r="48" fill="#cdd6df"/>
          <circle cx="88" cy="84" r="70" fill="url(#dotfine)" opacity=".9"/>
          <circle cx="96" cy="92" r="60" fill="#0c0e17"       opacity=".8"/>
          <circle cx="48" cy="56" r="8"  fill="#5a6776"       opacity=".6"/>
          <circle cx="70" cy="40" r="5"  fill="#5a6776"       opacity=".6"/>
        </g>
        <circle cx="60" cy="60" r="52" fill="none" stroke="#0c0e17" stroke-width="2"/>
      </svg>

      <div class="dither"></div>
      <div class="dither coarse"></div>`,

    onEnter() {
      // scatter stars into the freshly-injected SVG
      const g  = document.getElementById('stars');
      const NS = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < 150; i++) {
        const c = document.createElementNS(NS, 'rect');
        const x = Math.random() * 1440, y = Math.random() * 900;
        const s = Math.random() < .85 ? 1 : 2;
        c.setAttribute('x', x); c.setAttribute('y', y);
        c.setAttribute('width', s); c.setAttribute('height', s);
        c.setAttribute('fill', Math.random() < .2 ? '#ff5a2c' : '#e9e2cf');
        c.setAttribute('opacity', (0.25 + Math.random() * 0.65).toFixed(2));
        g.appendChild(c);
      }
      // default bar flicker: block glyphs only
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const glyphs = '█▓▒░##';
      _flicker = setInterval(() => {
        _bars.forEach(b => {
          const arr = b.dataset.orig.split('');
          const hits = 1 + Math.floor(Math.random() * 3);
          for (let k = 0; k < hits; k++) {
            arr[Math.floor(Math.random() * arr.length)] =
              glyphs[Math.floor(Math.random() * glyphs.length)];
          }
          b.textContent = arr.join('');
        });
      }, 200);
    },

    onLeave() { _stopFlicker(); }
  },

  /* ── retro_japanese_pulp ──────────────────── */
  retro_japanese_pulp: {
    label: 'JP PULP',

    objects: `
      <div class="fz-grid"></div>
      <div class="fz-patches"></div>

      <svg class="fz-speedlines" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="220" y1="0"   x2="0"   y2="220" stroke="#1a1410" stroke-width="1.2"/>
        <line x1="200" y1="0"   x2="0"   y2="185" stroke="#1a1410" stroke-width=".8"/>
        <line x1="178" y1="0"   x2="0"   y2="150" stroke="#1a1410" stroke-width="1"/>
        <line x1="150" y1="0"   x2="0"   y2="110" stroke="#1a1410" stroke-width=".7"/>
        <line x1="118" y1="0"   x2="0"   y2="74"  stroke="#1a1410" stroke-width="1.1"/>
        <line x1="220" y1="38"  x2="55"  y2="220" stroke="#1a1410" stroke-width=".9"/>
        <line x1="220" y1="82"  x2="100" y2="220" stroke="#1a1410" stroke-width=".7"/>
        <line x1="220" y1="135" x2="150" y2="220" stroke="#1a1410" stroke-width=".9"/>
      </svg>

      <svg class="fz-hatch" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <pattern id="fzhatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="9" stroke="#1a1410" stroke-width="1.2"/>
          </pattern>
        </defs>
        <rect width="180" height="180" fill="url(#fzhatch)"/>
      </svg>

      <div class="fz-obj ctrl"><img src="assets/retro_japanese_pulp/controller.svg" width="130" height="96"  alt="" draggable="false"></div>
      <div class="fz-obj disk"><a href="pages/0_ignite.html"><img src="assets/retro_japanese_pulp/disk.svg" width="78" height="80" alt="Ignite" draggable="false"></a></div>
      <div class="fz-obj can" ><img src="assets/retro_japanese_pulp/can.svg"        width="90"  height="162" alt="" draggable="false"></div>
      <div class="fz-obj ash" ><img src="assets/retro_japanese_pulp/ashtray.svg"    width="118" height="90"  alt="" draggable="false"></div>`,

    onEnter() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      // lock bar widths before swapping characters
      document.fonts.ready.then(() => {
        _bars.forEach(b => { b.style.width = b.offsetWidth + 'px'; });
        // kana flicker: half-width katakana stay monospace-width
        const hw = 'ｦｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ▓▒░';
        _flicker = setInterval(() => {
          _bars.forEach(b => {
            const a = b.dataset.orig.split('');
            const hits = 2 + Math.floor(Math.random() * 4);
            for (let k = 0; k < hits; k++) {
              a[Math.floor(Math.random() * a.length)] =
                hw[Math.floor(Math.random() * hw.length)];
            }
            b.textContent = a.join('');
          });
        }, 160);
      });
    },

    onLeave() {
      _stopFlicker();
      _bars.forEach(b => { b.style.width = ''; }); // release fixed width
    }
  }

  /* ── add new themes here ──────────────────── */
};

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   ENGINE
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
const _layer = document.getElementById('theme-layer');
const _btn   = document.getElementById('themebtn');
const _lbl   = document.getElementById('theme-label');
const _knob  = document.getElementById('knob-img');
const _bars  = document.querySelectorAll('.bar');
let _flicker = null;
let _current = 'default';

// store originals once
_bars.forEach(b => b.dataset.orig = b.textContent);

function _stopFlicker() {
  clearInterval(_flicker);
  _flicker = null;
  _bars.forEach(b => b.textContent = b.dataset.orig);
}

// knob rotation: spread themes evenly across -140° → +140°
// (like a real potentiometer — min at left, max at right)
function _knobAngle(idx, total) {
  const range = 280; // total sweep in degrees
  const start = -140;
  return total < 2 ? 0 : start + (idx / (total - 1)) * range;
}

function applyTheme(name, animate = true) {
  const theme = THEMES[name];
  if (!theme) return;

  const doSwap = () => {
    THEMES[_current]?.onLeave();

    document.body.dataset.theme = name;
    _layer.innerHTML = theme.objects;
    _lbl.textContent = theme.label;

    // rotate knob to match theme position
    const keys  = Object.keys(THEMES);
    const angle = _knobAngle(keys.indexOf(name), keys.length);
    _knob.style.transform = `rotate(${angle}deg)`;

    _current = name;
    theme.onEnter();

    if (animate) document.body.style.opacity = '1';
  };

  if (animate) {
    document.body.style.opacity = '0';
    setTimeout(doSwap, 180);
  } else {
    doSwap();
  }
}

// cycle through all registered themes
_btn.addEventListener('click', () => {
  const keys = Object.keys(THEMES);
  applyTheme(keys[(keys.indexOf(_current) + 1) % keys.length]);
});

// boot — no animation on first load
applyTheme('default', false);
</script>
</body>
